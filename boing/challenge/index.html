<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boing: can you beat my round?</title>
<meta name="robots" content="noindex">
<!-- Issue #39: people without Boing land here from a shared score link. iOS opens Boing directly
     when it's installed (universal link). Everyone else goes to the App Store, keeping the
     campaign tokens (pt, ct) so App Store Connect counts installs from shares. -->
<script>
(function () {
  var store = new URL("https://apps.apple.com/app/id6450435508");
  var params = new URLSearchParams(window.location.search);
  ["pt", "ct"].forEach(function (key) {
    var value = params.get(key);
    if (value && /^[A-Za-z0-9_-]{1,64}$/.test(value)) { store.searchParams.set(key, value); }
  });
  store.searchParams.set("mt", "8");
  window.location.replace(store.toString());
})();
</script>
</head>
<body style="background:#0b0d1a;color:#eee;font-family:-apple-system,sans-serif;text-align:center;padding-top:30vh">
<p><a style="color:#2ee6f0" href="https://apps.apple.com/app/id6450435508">Get Boing on the App Store</a></p>
</body>
</html>
